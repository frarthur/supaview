name: supaview
description: "SupaView — Admin mobile pour Supabase. Gérez vos bases Supabase directement depuis votre téléphone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Supabase
  supabase_flutter: ^2.8.3

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Theme
  flex_color_scheme: ^8.1.1

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.7
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  very_good_analysis: ^6.0.0

  # Code Generation
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  freezed: ^2.5.8
  riverpod_generator: ^2.6.3

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
